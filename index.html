    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Aplica o tema salvo (ou o já definido pela página hospedeira, ou o do sistema) antes da primeira pintura; espelha src/hooks/useTheme.js.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('pesquisas-urnas:tema'); } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') theme = document.documentElement.dataset.theme;
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"><p class="boot-loading">Carregando…</p></div>
    <script type="module" src="/src/main.js"></script>
  </body>
